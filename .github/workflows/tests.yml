name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests (in-memory SQLite and a fake model, no database or Ollama needed)
        run: python -m pytest -q -rs

  postgres:
    name: Postgres integration tests (pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cognitive_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d cognitive_os_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/cognitive_os_test
      # Any skipped postgres test, or none at all, fails this job (see test/conftest.py)
      REQUIRE_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run integration tests on PostgreSQL + pgvector
        run: python -m pytest -m postgres -v -rs

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, start, check and stop the Compose stack
        run: bash scripts/docker_smoke_test.sh

  frontend:
    name: Frontend tests (Vitest), type check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"   # jsdom needs >= 22.22.2; 24 is the current LTS
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Component tests (Vitest, jsdom)
        run: npm test
      - name: Type check and build
        run: npm run build
